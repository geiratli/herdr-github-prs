name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Helper scripts parse under sh and bash
        run: for f in mods/github-prs/helpers/*.sh; do sh -n "$f" && bash -n "$f"; done
